[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal_tscf_bench"
version = "0.1.0"
description = "Four-axis benchmark for causal faithfulness evaluation of temporal counterfactual explainers"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "tslearn>=0.6",
    "torchdiffeq>=0.2",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["causal_tscf_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
