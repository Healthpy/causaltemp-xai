name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --python 3.11

      - name: Format check with Black
        run: uv run --python 3.11 black --check causaltemp_xai tests experiments

      - name: Import sorting check with isort
        run: uv run --python 3.11 isort --check-only causaltemp_xai tests experiments

      - name: Lint with Ruff
        run: uv run --python 3.11 ruff check causaltemp_xai tests experiments

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --python 3.11

      # The committed uv.lock pins torch to a CUDA build (from a private index),
      # whose libtorch_cuda.so fails to load on this CPU-only runner
      # (undefined symbol: ncclCommResume), breaking `import torch` and every test
      # at collection. Reinstall the CPU torch wheel from the public PyTorch index
      # over the locked CUDA one (UV_TORCH_BACKEND is ignored once the lock fixes
      # the source). See https://docs.astral.sh/uv/guides/integration/pytorch/
      - name: Use CPU torch (runner is CPU-only)
        run: >-
          uv pip install torch
          --index-url https://download.pytorch.org/whl/cpu
          --reinstall-package torch

      # --no-sync: do NOT re-sync against the lockfile here — that would revert
      # the CPU torch installed above back to the locked CUDA build. The env was
      # already synced in "Install dependencies".
      - name: Run tests
        run: uv run --no-sync --python 3.11 pytest tests/ -q

      # Exercises the phased pipeline (experiments/01..06) — the path the README
      # documents as "recommended", so the tested path matches the documented one.
      - name: Smoke harness (phased pipeline)
        run: |
          uv run --no-sync --python 3.11 python experiments/01_generate_benchmarks.py --config smoke
          uv run --no-sync --python 3.11 python experiments/02_train_classifiers.py --config smoke
          uv run --no-sync --python 3.11 python experiments/03_run_cf_methods.py --config smoke --n-cf 10
          uv run --no-sync --python 3.11 python experiments/04_evaluate_axes.py --config smoke
          uv run --no-sync --python 3.11 python experiments/06_aggregate_and_report.py figures
