name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The runner is CPU-only, but the default torch wheel is the CUDA build,
    # whose libtorch_cuda.so fails to load here (undefined symbol: ncclCommResume),
    # breaking `import torch` and every test at collection. Tell uv to resolve the
    # CPU torch wheels instead. See https://docs.astral.sh/uv/guides/integration/pytorch/
    env:
      UV_TORCH_BACKEND: cpu

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev --python 3.11

      - name: Run tests
        run: uv run --python 3.11 pytest tests/ -q

      - name: Smoke harness (end-to-end pipeline)
        run: |
          uv run --python 3.11 python -m causaltemp_xai.data_io --config smoke
          uv run --python 3.11 python -m causaltemp_xai.classifiers.tcn --config smoke --train
          uv run --python 3.11 python experiments/run_all.py --config smoke --n-cf 10 --no-dice-ml
          uv run --python 3.11 python experiments/figures.py --results experiments/results.json
