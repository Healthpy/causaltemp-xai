[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causaltemp-xai"
version = "0.1.0"
description = "Causal counterfactual explanations for temporal data"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "causaltemp-xai contributors" }]
keywords = ["explainability", "counterfactual", "time-series", "causal", "xai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "captum>=0.8.0",
    "timeshap>=1.0.4",
    # timeshap imports `shap.explainers._kernel.Kernel`, removed in shap>=0.44;
    # pin to the last compatible release. Nothing else in the repo uses shap.
    "shap==0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black==25.11.0",
    "isort>=5.12",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "sphinx>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["causaltemp_xai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["causaltemp_xai"]
omit = ["tests/*", "experiments/*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "RUF",  # Ruff-specific
]
ignore = [
    "E501",    # line too long (handled by black)
    "E741",    # ambiguous variable name — `l` is the lag index throughout (standard notation)
    "RUF002",  # ambiguous unicode in docstrings — Greek letters (ε, Δ) and × in math notation
    "RUF003",  # ambiguous unicode in comments — same math notation
    "UP007",   # non-PEP604 Union[...] — kept for the py39 runtime target
    "UP045",   # non-PEP604 Optional[...] — kept for the py39 runtime target
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # set to true after initial implementation
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
exclude = [
    "build",
    "dist",
    '\.venv',
    '\.git',
    '\.eggs',
    "third_party",
]
